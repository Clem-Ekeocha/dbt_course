version: 2

models:
    - name: dim_listings_cleansed
      description: "This model is a cleaned table with airbnb lisitings"
      data_tests:
        - name: minimum_row_count
          test_name: minimum_row_count
          arguments:
            min_row_count: 1000
          config:
            severity: error
      columns:
        - name: listing_id
          description: "The unique identifier for each listing"
          data_tests:
            - not_null
            - unique
    
        - name: host_id
          description: "The unique identifier for each host. References host table"
          data_tests:
            - not_null
            - relationships:
                arguments:
                    to: ref('dim_hosts_cleansed')
                    field: host_id
        - name: room_type
          description: "The type of apartment/room"
          data_tests:
            - accepted_values:
                arguments:
                    values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']  
        - name: minimum_nights
          description: "{{ doc('dim_listing_cleansed__minimum_nights') }}"
          data_tests:
            - positive_values

    - name: dim_hosts_cleansed
      config:                # this block confiures this test to be a contract
        contract:
          enforced: true        # this block confiures this test to be a contract
      constraints:
        - type: primary_key
          columns: [host_id]
      columns:
        - name: host_id
          data_type: integer   # this block confiures this test to be a contract
          constraints:
            - type: not_null
            - type: unique
          data_tests:
            - unique
            - not_null
            - relationships:
                arguments:
                    to: ref('dim_listings_cleansed')
                    field: host_id
        
        - name: is_superhost
          data_type: string   # this block confiures this test to be a contract
          data_tests:
            - accepted_values:
                arguments:
                    values: ['t', 'f']

        - name: host_name
          data_type: string   # this block confiures this test to be a contract
          constraints:
            - type: not_null
          data_tests:
            - not_null
        
        - name: updated_at
          data_type: timestamp   # this block confiures this test to be a contract
          data_tests:
            - not_null

        - name: created_at
          data_type: timestamp    # this block confiures this test to be a contract
          data_tests:
            - not_null